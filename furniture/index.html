<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>FURNITURE.</title><style>body{margin:0;background:#ddd;font:12px monospace}canvas{display:block;width:100vw;height:100dvh;touch-action:none}aside{position:absolute;top:8px;left:8px;background:#f4f4efeb;border:2px solid;padding:8px;line-height:1.5}button{background:#fff;border:1px solid;font:inherit;padding:6px}#pad{position:absolute;bottom:10px;left:8px;display:flex;gap:4px}#pad button{font-size:20px;min-width:40px;height:42px}#height{position:absolute;bottom:10px;right:8px;background:white;padding:8px}</style><canvas id="c"></canvas><aside><b style="font-size:19px">FURNITURE.</b><div>ROOM 001 / A WAY OUT</div><div>ドラッグ:家具を動かす<br>Q/E:回転 / WASD:歩く<br>SPACE:登る / 赤い扉へ</div><button onclick="location.reload()">RESTART</button><button onclick="add(1+Math.random()*8,1+Math.random()*8,items.length)">+ FURNITURE</button></aside><div id="pad"><button data-k="ArrowUp">↑</button><button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button><button data-k=" ">↑↑</button><button onclick="rot(-1)">↶</button><button onclick="rot(1)">↷</button></div><div id="height">HEIGHT <span id="h">0.0</span>m</div><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),K={};let W,H,S,ox,oy,items=[],picked=null,hero={x:1,y:8,z:0},done=false;function resize(){let d=devicePixelRatio||1;W=c.width=innerWidth*d;H=c.height=innerHeight*d;S=Math.min(W/18,H/13);ox=W*.52;oy=H*.56}onresize=resize;resize();const types=[['CHAIR',1,1,1],['TABLE',2,1.5,1.3],['CABINET',1.5,1.2,1.9],['BOX',1.2,1.2,1.1],['SOFA',2,1.2,1],['STOOL',.8,.8,.8]];function add(x,y,n){let t=types[n%6];items.push({x,y,z:0,w:t[1],d:t[2],h:t[3],name:t[0],a:0,v:0,u:0})}[[2,2,2],[4,2,1],[6,2,0],[3,5,3],[6,5,4],[8,6,5],[3,8,0],[7,8,2]].forEach(p=>add(...p));function P(x,y,z=0){return{x:ox+(x-y)*S*.79,y:oy+(x+y)*S*.4-z*S*.82}}function inv(x,y,z){let a=(x-ox)/(S*.79),b=(y-oy+z*S*.82)/(S*.4);return{x:(a+b)/2,y:(b-a)/2}}function poly(ps,fill){g.beginPath();g.moveTo(ps[0].x,ps[0].y);ps.slice(1).forEach(p=>g.lineTo(p.x,p.y));g.closePath();g.fillStyle=fill;g.fill();g.strokeStyle='#292929';g.lineWidth=devicePixelRatio;g.stroke()}function line(a,b,color='#aaa'){g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.strokeStyle=color;g.lineWidth=devicePixelRatio;g.stroke()}function box(x,y,z,w,d,h,color){let A=P(x-w/2,y-d/2,z),B=P(x+w/2,y-d/2,z),C=P(x+w/2,y+d/2,z),D=P(x-w/2,y+d/2,z),E=P(x-w/2,y-d/2,z+h),F=P(x+w/2,y-d/2,z+h),G=P(x+w/2,y+d/2,z+h),I=P(x-w/2,y+d/2,z+h);poly([D,C,G,I],'#999992');poly([B,C,G,F],'#bfbfb9');poly([E,F,G,I],color)}function dim(o){return{w:Math.abs(Math.cos(o.a))*o.w+Math.abs(Math.sin(o.a))*o.d,d:Math.abs(Math.sin(o.a))*o.w+Math.abs(Math.cos(o.a))*o.d}}function overlap(a,b){let A=dim(a),B=dim(b);return Math.max(0,(A.w+B.w)/2-Math.abs(a.x-b.x))*Math.max(0,(A.d+B.d)/2-Math.abs(a.y-b.y))}function floor(o){let z=0,s=null;for(let q of items)if(q!==o&&overlap(o,q)>.13&&q.z+q.h<=o.z+.35&&q.z+q.h>z){z=q.z+q.h;s=q}return{z,s}}function under(x,y){let z=0;for(let o of items){let b=dim(o);if(Math.abs(x-o.x)<b.w/2+.08&&Math.abs(y-o.y)<b.d/2+.08)z=Math.max(z,o.z+o.h)}return z}function update(dt){for(let o of items){if(o===picked)continue;let f=floor(o);if(o.z>f.z+.01){o.v-=11*dt;o.z+=o.v*dt;if(o.z<f.z){o.z=f.z;o.v=0}}else{o.z=f.z;o.v=0}if(f.s){let a=overlap(o,f.s)/(o.w*o.d);if(a<.42){o.u+=dt;if(o.u>.4){o.x+=(o.x-f.s.x||.2)*dt*.9;o.y+=(o.y-f.s.y||.2)*dt*.9}}else o.u=Math.max(0,o.u-dt)}else o.u=0;o.x=Math.max(.5,Math.min(9.5,o.x));o.y=Math.max(.5,Math.min(9.5,o.y))}let dx=(K.d||K.ArrowRight?1:0)-(K.a||K.ArrowLeft?1:0),dy=(K.s||K.ArrowDown?1:0)-(K.w||K.ArrowUp?1:0),l=Math.hypot(dx,dy)||1,nx=Math.max(.2,Math.min(9.8,hero.x+dx/l*2.5*dt)),ny=Math.max(.2,Math.min(9.8,hero.y+dy/l*2.5*dt)),z=under(nx,ny);if(z<=hero.z+(K[' ']?1.5:.5)){hero.x=nx;hero.y=ny;hero.z=z}else hero.z=Math.min(hero.z,under(hero.x,hero.y));document.getElementById('h').textContent=hero.z.toFixed(1);if(hero.z>3.1&&hero.x>8&&hero.y<3&&!done){done=true;alert('YOU HAVE LEFT THE ROOM.')}}function draw(){g.fillStyle='#dadad4';g.fillRect(0,0,W,H);poly([P(0,0),P(10,0),P(10,10),P(0,10)],'#ecece5');for(let i=0;i<=10;i++){line(P(i,0),P(i,10),'#cecec8');line(P(0,i),P(10,i),'#cecec8')}for(let z=1;z<=5;z++){line(P(0,0,z),P(10,0,z));line(P(0,0,z),P(0,10,z))}box(9,1,3.3,1.2,.2,1.7,'#555');let ex=P(9,1,5.25);g.font=`${12*devicePixelRatio}px monospace`;g.fillStyle='#333';g.fillText('EXIT',ex.x,ex.y);let all=[...items,{hero:true,...hero}].sort((a,b)=>(a.x+a.y+a.z*.1)-(b.x+b.y+b.z*.1));for(let o of all){if(o.hero){let foot=P(o.x,o.y,o.z),head=P(o.x,o.y,o.z+.65);line(head,foot,'#111');g.beginPath();g.arc(head.x,head.y,5*devicePixelRatio,0,Math.PI*2);g.fillStyle='#111';g.fill();continue}let d=dim(o);box(o.x,o.y,o.z,d.w,d.d,o.h,o===picked?'#fff':'#e5e5de');if(o.name==='CHAIR')box(o.x,o.y+d.d*.35,o.z+o.h*.45,d.w*.85,.15,o.h*.55,'#d2d2cc');if(o.name==='TABLE')box(o.x,o.y,o.z+o.h*.83,d.w,d.d,.12,'#f9f9f2');if(o.name==='SOFA')box(o.x,o.y+d.d*.3,o.z+o.h*.5,d.w,.3,o.h*.5,'#b7b7b0')}}let prev=performance.now();function frame(t){let dt=Math.min(.03,(t-prev)/1000);prev=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);function point(e){return{x:e.clientX*devicePixelRatio,y:e.clientY*devicePixelRatio}}c.onpointerdown=e=>{let p=point(e),best=1e9;picked=null;for(let o of items){let q=P(o.x,o.y,o.z+o.h*.5),dist=Math.hypot(p.x-q.x,p.y-q.y);if(dist<S*1.2&&dist<best){best=dist;picked=o}}if(picked)c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!picked)return;let p=point(e),v=inv(p.x,p.y,picked.z+picked.h*.5);picked.x=Math.max(.6,Math.min(9.4,v.x));picked.y=Math.max(.6,Math.min(9.4,v.y));picked.u=0};c.onpointerup=()=>picked=null;c.onpointercancel=()=>picked=null;function rot(v){let o=picked||items.reduce((a,b)=>Math.hypot(a.x-hero.x,a.y-hero.y)<Math.hypot(b.x-hero.x,b.y-hero.y)?a:b);if(o&&Math.hypot(o.x-hero.x,o.y-hero.y)<3)o.a+=v*Math.PI/2}onkeydown=e=>{K[e.key]=true;if(e.key==='q')rot(-1);if(e.key==='e')rot(1);if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()};onkeyup=e=>K[e.key]=false;document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();K[k]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=()=>K[k]=false;b.onpointercancel=()=>K[k]=false});</script></html>
